<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - Godeniter MVC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #ffffff; max-width: 400px; width: 100%; border-radius: 12px; padding: 32px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #0f172a; text-align: center; }
        p.desc { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 24px; }
        .error-msg { background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #0284c7; }
        button { width: 100%; background: #0284c7; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background: #0369a1; }
        .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #64748b; text-decoration: none; }
        .back-link:hover { color: #0284c7; }
        .tip { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 6px; margin-top: 20px; font-size: 12px; color: #64748b; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 管理员登录</h1>
        <p class="desc">传统 HTML 表单 POST 提交验证</p>

        {{ if .Error }}
        <div class="error-msg">⚠️ {{ .Error }}</div>
        {{ end }}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>账号</label>
                <input type="text" name="username" value="{{ .Username }}" required placeholder="请输入用户名 (如: admin)">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码 (如: 123456)">
            </div>
            <button type="submit">提交登录 (Form POST)</button>
        </form>

        <a href="/" class="back-link">&larr; 返回首页</a>

        <div class="tip">
            💡 演示测试账号：<strong>admin</strong><br>
            💡 演示测试密码：<strong>123456</strong>
        </div>
    </div>
</body>
</html>
