<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .AppName }} - 运行成功</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-box {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
        }
        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #38bdf8;
        }
        .api-list {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 28px;
        }
        .api-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 13px;
        }
        .api-item:last-child {
            border-bottom: none;
        }
        .method-get {
            background: #10b981;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            margin-right: 8px;
        }
        .method-post {
            background: #f59e0b;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            margin-right: 8px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">0-Dependency Framework</span>
        <h1>{{ .AppName }} 已成功启动！</h1>
        <p class="subtitle">这是一个纯 Go 标准库（0 外部依赖）、支持 Martini 风格依赖注入与轻量级 MVC 的现代化服务端系统。</p>

        <div class="grid">
            <div class="stat-box">
                <div class="stat-label">框架版本</div>
                <div class="stat-value">v{{ .Version }}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">服务启动时间</div>
                <div class="stat-value">{{ .StartTime }}</div>
            </div>
        </div>

        <div class="api-list">
            <div style="font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px;">可用 API 接口快速测试：</div>
            <div class="api-item">
                <div><span class="method-get">GET</span><code>/api/info</code></div>
                <a href="/api/info" target="_blank" style="color: #38bdf8; text-decoration: none;">直接访问 &rarr;</a>
            </div>
            <div class="api-item">
                <div><span class="method-get">GET</span><code>/hello/开发者</code></div>
                <a href="/hello/%E5%BC%80%E5%8F%91%E8%80%85" target="_blank" style="color: #38bdf8; text-decoration: none;">直接访问 &rarr;</a>
            </div>
        </div>

        <div class="footer">
            Godeniter Framework &bull; 单二进制文件打包 &bull; 双击即用
        </div>
    </div>
</body>
</html>
